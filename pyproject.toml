[project]
name = "cloudgripper-wm"
version = "0.1.0"
description = "World Models on CloudGripper"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cloudgripper-api",
    "datasets>=4.8.5",
    "h5py>=3.16.0",
    "hdf5plugin>=6.0.0",
    "imageio[ffmpeg]>=2.37.3",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "ogbench",
    "opencv-python>=4.13.0.92",
    "pybase64>=1.4.3",
    "requests>=2.34.2",
    "scikit-learn>=1.7.2",
    "stable-worldmodel[env,train]",
    "websocket-client>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
cloudgripper-api = { path = "third_party/cloudgripper-api", editable = true }
stable-worldmodel = { path = "third_party/stable-worldmodel", editable = true }

[tool.uv]
# gymnasium[all] (pulled in via stable-worldmodel[env]) depends on box2d,
# which has no wheel or sdist for linux/aarch64 (e.g. NAISS Arrhenius's
# GH200 GPU nodes) — `uv sync` hard-fails there otherwise. Box2D-based envs
# (LunarLander etc.) aren't used by this project, so it's safe to drop the
# requirement specifically on that platform rather than everywhere.
override-dependencies = [
    "box2d; sys_platform != 'linux' or platform_machine != 'aarch64'",
]
