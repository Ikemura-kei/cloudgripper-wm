defaults:
  - cloudgripper_mj
  - _self_

# output
output: .stable_worldmodel/datasets/
output_name: cloudgripper_mj_cube

policy:
  _target_: cloudgripper_wm.policies.HeuristicGraspPolicy
  min_repeat: 2
  max_repeat: 5
  noise_std: 0.1

world:
  max_episode_steps: 500

# Which parts of the env's variation_space to resample each episode —
# e.g. ['agent.start_pos', 'agent.goal_pos', 'cube.start_pos', 'cube.goal_pos']
# to vary cube position but leave its size/color fixed at their init_value.
# Left as null, the env falls back to its own CloudgripperMuJoCoCube.DEFAULT_VARIATIONS.
variation: null
